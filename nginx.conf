# Mesmas regras de rota do vercel.json: /admin -> painel, demais rotas -> loja (zero 404)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Arquivos com hash gerados pelo Vite podem ficar em cache por longo prazo
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Logos, mascote e demais arquivos de public/ (sem hash): cache curto
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location = /admin {
    try_files /admin.html =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
